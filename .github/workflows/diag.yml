name: diag
on:
  push:
    branches: ['diag/**']
permissions:
  contents: read
jobs:
  coldstart:
    name: coldstart (${{ matrix.order }})
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        order: ['job,ps,addtype', 'ps,addtype,job']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          package-manager-cache: false
      - shell: bash
        run: node scripts/diag-winjob.mjs '${{ matrix.order }}'
