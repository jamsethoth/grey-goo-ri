version: 2
updates:
  # Bumps the SHA pins in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  # The dev dependencies (ADR 0018). typescript stays below 6.1 while typescript-eslint supports nothing newer.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev:
        patterns: ['*']
    ignore:
      - dependency-name: typescript
        versions: ['>=6.1']
    commit-message:
      prefix: deps
