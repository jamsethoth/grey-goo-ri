version: 2
updates:
  # Bumps the SHA pins in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  # jsonc-parser (docs/library-survey.md) and the dev dependencies (ADR 0018). typescript stays below 6.1 while
  # typescript-eslint supports nothing newer.
  # A new @types/node major waits for a decision about the Node floor, which it must match (ADR 0020).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev:
        patterns: ['*']
    ignore:
      - dependency-name: typescript
        versions: ['>=6.1']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: deps
